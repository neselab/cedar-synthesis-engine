[project]
name = "autocedar"
version = "0.2.0"
description = "Human-in-the-loop Cedar policy authoring with symbolic verification."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "AutoCedar Authors" },
]
keywords = [
    "access-control",
    "cedar",
    "cegis",
    "formal-methods",
    "human-in-the-loop",
    "policy-synthesis",
    "verification",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]
dependencies = [
    "anthropic>=0.84,<1",
    "openai>=2.45,<3",
    "pydantic>=2.12,<3",
    "textual>=8.2,<9",
]

[project.urls]
Homepage = "https://github.com/neselab/cedar-synthesis-engine"
Repository = "https://github.com/neselab/cedar-synthesis-engine"
Issues = "https://github.com/neselab/cedar-synthesis-engine/issues"
Documentation = "https://github.com/neselab/cedar-synthesis-engine#readme"
Changelog = "https://github.com/neselab/cedar-synthesis-engine/blob/main/CHANGELOG.md"

[project.scripts]
autocedar = "autocedar.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["autocedar", "autocedar.*"]
exclude = [
    "autocedar-runs*",
    "cedarbench*",
    "dataset*",
    "experiments*",
    "eval_runs*",
    "workspace*",
    "workspace_demo_backup*",
    "tests*",
]

[tool.setuptools.package-data]
autocedar = ["prompts/*.md"]
